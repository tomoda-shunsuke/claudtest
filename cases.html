<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案件情報管理システム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f0f4f8; min-height: 100vh; }

  /* ===== LOGIN ===== */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
  }
  .login-box {
    background: #fff; border-radius: 16px; padding: 48px 40px;
    width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .login-box h1 { text-align: center; font-size: 1.4rem; color: #0f766e; margin-bottom: 8px; }
  .login-box p.subtitle { text-align: center; color: #6b7280; font-size: 0.85rem; margin-bottom: 32px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 0.85rem; color: #374151; margin-bottom: 6px; font-weight: 600; }
  .form-group input {
    width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db;
    border-radius: 8px; font-size: 0.95rem; transition: border-color 0.2s;
  }
  .form-group input:focus { outline: none; border-color: #14b8a6; }
  .login-btn {
    width: 100%; padding: 12px; background: linear-gradient(90deg, #0f766e, #14b8a6);
    color: #fff; border: none; border-radius: 8px; font-size: 1rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  .login-btn:hover { opacity: 0.9; }
  .login-error {
    background: #fee2e2; color: #dc2626; border-radius: 8px;
    padding: 10px 14px; font-size: 0.85rem; margin-bottom: 16px; display: none;
  }

  /* ===== APP ===== */
  #app { display: none; }
  .header {
    background: linear-gradient(90deg, #0f766e 0%, #0d9488 100%);
    color: #fff; padding: 20px 24px;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 1.3rem; font-weight: 700; }
  .logout-btn {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4);
    color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer;
    font-size: 0.82rem; transition: background 0.2s;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.25); }
  .header-meta {
    margin-top: 10px; display: flex; flex-wrap: wrap; gap: 12px;
    font-size: 0.82rem; opacity: 0.9;
  }
  .header-meta span { background: rgba(255,255,255,0.12); padding: 3px 10px; border-radius: 12px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 20px 24px; }
  @media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: #fff; border-radius: 12px; padding: 18px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); text-align: center; }
  .stat-card .num { font-size: 2rem; font-weight: 700; color: #0f766e; }
  .stat-card .label { font-size: 0.8rem; color: #6b7280; margin-top: 4px; }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 24px 16px; align-items: center; }
  .controls input[type=text] { padding: 8px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; width: 240px; }
  .controls input[type=text]:focus { outline: none; border-color: #14b8a6; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { padding: 7px 14px; border: 1.5px solid #d1d5db; border-radius: 20px; background: #fff; cursor: pointer; font-size: 0.82rem; transition: all 0.2s; }
  .filter-btn.active { background: #0f766e; color: #fff; border-color: #0f766e; }
  .sort-select { padding: 8px 12px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 0.85rem; background: #fff; cursor: pointer; }

  /* Table */
  .table-wrap { padding: 0 24px 32px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  th { background: #0f766e; color: #fff; padding: 12px 14px; font-size: 0.82rem; font-weight: 600; text-align: left; white-space: nowrap; }
  td { padding: 12px 14px; font-size: 0.88rem; color: #374151; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f0fdfa; }
  .case-name { font-weight: 700; color: #0f766e; cursor: pointer; }
  .case-name:hover { text-decoration: underline; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.74rem; font-weight: 700; white-space: nowrap; }
  .cat-data { background: #dbeafe; color: #1d4ed8; }
  .cat-web { background: #dcfce7; color: #16a34a; }
  .cat-design { background: #fce7f3; color: #be185d; }
  .cat-nw { background: #ede9fe; color: #6d28d9; }
  .cat-ops { background: #fef9c3; color: #ca8a04; }
  .status-active { background: #dcfce7; color: #15803d; }
  .status-open { background: #fee2e2; color: #dc2626; }
  .tag { display: inline-block; background: #f1f5f9; color: #475569; border-radius: 6px; padding: 2px 8px; font-size: 0.74rem; margin: 2px 2px 0 0; }

  /* Cards (mobile) */
  .cards-wrap { display: none; padding: 0 16px 32px; }
  @media (max-width: 768px) {
    .table-wrap { display: none; }
    .cards-wrap { display: block; }
  }
  .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .card-name { font-weight: 700; font-size: 1rem; color: #0f766e; cursor: pointer; }
  .card-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #6b7280; margin-bottom: 6px; gap: 12px; }
  .card-row span:last-child { color: #374151; font-weight: 500; text-align: right; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 90%; max-width: 760px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #e5e7eb; }
  .modal-header h3 { font-size: 1rem; color: #0f766e; padding-right: 12px; }
  .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #6b7280; line-height: 1; }
  .modal-body { flex: 1; padding: 20px; overflow-y: auto; }
  .modal-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .modal-detail { white-space: pre-wrap; font-size: 0.86rem; line-height: 1.7; color: #374151; background: #f9fafb; padding: 16px; border-radius: 8px; }

  .empty-row td { text-align: center; color: #9ca3af; padding: 32px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>案件情報管理システム</h1>
    <p class="subtitle">ログインしてください</p>
    <div class="login-error" id="login-error">IDまたはパスワードが正しくありません。</div>
    <div class="form-group">
      <label>ID</label>
      <input type="text" id="login-id" placeholder="ユーザーID" autocomplete="username">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="login-pass" placeholder="パスワード" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <h1>案件情報管理システム</h1>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
    <div class="header-meta">
      <span>2026_営業_案件情報</span>
      <span id="meta-count">全 0 件</span>
      <span>出典：Figma ボード</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">案件合計</div></div>
    <div class="stat-card"><div class="num" id="stat-open">0</div><div class="label">募集中</div></div>
    <div class="stat-card"><div class="num" id="stat-active">0</div><div class="label">参画中あり</div></div>
    <div class="stat-card"><div class="num" id="stat-head">0</div><div class="label">募集人数(目安)</div></div>
  </div>

  <div class="controls">
    <input type="text" id="search-input" placeholder="案件名・技術・場所で検索..." oninput="renderTable()">
    <div class="filter-group" id="cat-filters">
      <button class="filter-btn active" data-cat="all" onclick="setCatFilter('all')">すべて</button>
      <button class="filter-btn" data-cat="data" onclick="setCatFilter('data')">データ基盤・BI</button>
      <button class="filter-btn" data-cat="web" onclick="setCatFilter('web')">Web・業務系</button>
      <button class="filter-btn" data-cat="design" onclick="setCatFilter('design')">デザイン・制作</button>
      <button class="filter-btn" data-cat="nw" onclick="setCatFilter('nw')">NW・通信</button>
      <button class="filter-btn" data-cat="ops" onclick="setCatFilter('ops')">運用保守</button>
    </div>
    <select class="sort-select" id="sort-select" onchange="renderTable()">
      <option value="default">並び順：デフォルト</option>
      <option value="price_desc">単価：高い順</option>
      <option value="price_asc">単価：安い順</option>
      <option value="name_asc">案件名：昇順</option>
    </select>
  </div>

  <!-- Desktop Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>案件名</th>
          <th>分野</th>
          <th>主な技術</th>
          <th>場所 / リモート</th>
          <th>単価</th>
          <th>募集</th>
          <th>時期</th>
          <th>状況</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <!-- Mobile Cards -->
  <div class="cards-wrap" id="cards-body"></div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">案件詳細</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ===== Auth =====
const VALID_ID = 'webedge';
const VALID_PASS = 'webedge99';

function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  if (id === VALID_ID && pass === VALID_PASS) {
    errEl.style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderTable();
  } else {
    errEl.style.display = 'block';
  }
}
function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-id').value = '';
  document.getElementById('login-pass').value = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') doLogin();
});

// ===== State =====
let catFilter = 'all';
function setCatFilter(cat) {
  catFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.cat === cat));
  renderTable();
}

function parsePrice(p) {
  const m = String(p).match(/(\d+)/g);
  return m ? Math.max(...m.map(Number)) : 0;
}
function parseHead(h) {
  const m = String(h).match(/(\d+)/);
  return m ? Number(m[1]) : 0;
}

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;
  let list = cases.filter(c => {
    const matchCat = catFilter === 'all' || c.cat === catFilter;
    const hay = (c.name + ' ' + c.skills.join(' ') + ' ' + c.location + ' ' + c.detail).toLowerCase();
    const matchSearch = !q || hay.includes(q);
    return matchCat && matchSearch;
  });
  if (sort === 'price_desc') list.sort((a,b) => parsePrice(b.price) - parsePrice(a.price));
  else if (sort === 'price_asc') list.sort((a,b) => parsePrice(a.price) - parsePrice(b.price));
  else if (sort === 'name_asc') list.sort((a,b) => a.name.localeCompare(b.name, 'ja'));
  return list;
}

function catBadge(c) { return `<span class="badge cat-${c}">${CAT_LABEL[c]}</span>`; }
function statusBadge(c) { return `<span class="badge status-${c.status}">${c.statusText}</span>`; }
function skillTags(arr) { return arr.map(s => `<span class="tag">${s}</span>`).join(''); }

function renderTable() {
  const list = getFiltered();
  document.getElementById('stat-total').textContent = cases.length;
  document.getElementById('stat-open').textContent = cases.filter(c => c.status === 'open').length;
  document.getElementById('stat-active').textContent = cases.filter(c => c.status === 'active').length;
  document.getElementById('stat-head').textContent = cases.reduce((s,c) => s + parseHead(c.head), 0);
  document.getElementById('meta-count').textContent = '全 ' + cases.length + ' 件';

  const tbody = document.getElementById('table-body');
  if (list.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">該当する案件がありません</td></tr>';
  } else {
    tbody.innerHTML = list.map(c => `
      <tr>
        <td><span class="case-name" onclick="openModal(${c.id})">${c.name}</span></td>
        <td>${catBadge(c.cat)}</td>
        <td style="max-width:200px;">${skillTags(c.skills)}</td>
        <td style="max-width:160px;font-size:0.82rem;">${c.location}</td>
        <td style="white-space:nowrap;">${c.price}</td>
        <td style="white-space:nowrap;">${c.head}</td>
        <td style="white-space:nowrap;font-size:0.82rem;">${c.period}</td>
        <td>${statusBadge(c)}</td>
      </tr>
    `).join('');
  }

  const cards = document.getElementById('cards-body');
  cards.innerHTML = list.map(c => `
    <div class="card">
      <div class="card-header">
        <span class="card-name" onclick="openModal(${c.id})">${c.name}</span>
        ${catBadge(c.cat)}
      </div>
      <div class="card-row"><span>技術</span><span>${c.skills.join(' / ')}</span></div>
      <div class="card-row"><span>場所</span><span>${c.location}</span></div>
      <div class="card-row"><span>単価</span><span>${c.price}</span></div>
      <div class="card-row"><span>募集</span><span>${c.head}</span></div>
      <div class="card-row"><span>時期</span><span>${c.period}</span></div>
      <div class="card-row"><span>状況</span><span>${statusBadge(c)}</span></div>
    </div>
  `).join('') || '<p style="text-align:center;color:#9ca3af;padding:32px;">該当する案件がありません</p>';
}

// ===== Modal =====
function openModal(id) {
  const c = cases.find(x => x.id === id);
  if (!c) return;
  document.getElementById('modal-title').textContent = c.name;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-meta">
      ${catBadge(c.cat)} ${statusBadge(c)}
      <span class="tag">単価：${c.price}</span>
      <span class="tag">募集：${c.head}</span>
      <span class="tag">時期：${c.period}</span>
      <span class="tag">場所：${c.location}</span>
    </div>
    <div style="margin-bottom:14px;">${skillTags(c.skills)}</div>
    <div class="modal-detail">${c.detail}</div>
  `;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-body').innerHTML = '';
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
</script>
